# This file is auto-generated by DevPlatform for further customizing as you wish.
# NOTE: You should not delete this file!

stages:
  - test
  - deploy

variables:
  SSH_KNOWN_HOSTS: "178.154.217.140 158.160.20.196"
  APP_DIR: "/home/ubuntu/backend"

test:
  stage: test
  image: python:3.12-slim
  variables:
    PIP_NO_CACHE_DIR: "1"
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - |
        set +e
        pytest --cov=. --cov-report=term-missing --cov-report=xml
        status=$?
        set -e
        # 5 = "no tests collected" -> считаем успехом
        if [ "$status" -eq 5 ]; then
          echo "No tests collected, treating as success"
          exit 0
        fi
        exit "$status"
  artifacts:
    paths:
      - coverage.xml
      - .pytest_cache/
    expire_in: 1 week
  only:
    - master
    - experiment

deploy_prod:
  stage: deploy
  image: alpine:latest
  only:
    - master
  before_script:
    - apk add --no-cache openssh rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" | xargs -n1 ssh-keyscan -H >> ~/.ssh/known_hosts
    - echo "$PROD_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - rsync -az --delete ./ ubuntu@178.154.217.140:${APP_DIR}
    - ssh ubuntu@178.154.217.140 "
        cd ${APP_DIR} &&
        sudo docker compose pull || true &&
        sudo docker compose up -d --build
      "

