services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: prod
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build: .
    restart: always
    environment:
      DB_IP: db
      DB_USER: user
      DB_PASSWORD: password
      DB_DB: prod
      RANDOM_SECRET: "AJd27GqoS#gvxp@V"
      # ML на хосте (порт 80): контейнер обращается к хосту через host.docker.internal
      # Если ML в этом же compose как сервис ml — задайте ML_SERVICE_URL=http://ml:80
      ML_SERVICE_URL: "http://host.docker.internal:80"
    depends_on:
      - db
    ports:
      - "8080:8080"
    # Чтобы с контейнера достучаться до сервисов на хосте (в т.ч. другой контейнер на порту 80)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tests:
    build: .
    environment:
      DB_IP: db
      DB_USER: user
      DB_PASSWORD: password
      DB_DB: prod
      RANDOM_SECRET: "AJd27GqoS#gvxp@V"
    depends_on:
      - db
    command: ["pytest", "--cov=.", "--cov-report=term-missing", "-q", "--override-ini=asyncio_default_fixture_loop_scope=function", "-W", "ignore::DeprecationWarning"]

volumes:
  db-data:

