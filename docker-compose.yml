services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: prod
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # Прокси к ML на хосте: из контейнера app идёт запрос на ml-proxy:8008,
  # nginx проксирует на host.docker.internal:8008 (ML на той же машине).
  ml-proxy:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx/ml-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Порт наружу не пробрасываем доступ только внутри сети композа

  app:
    build: .
    restart: always
    environment:
      DB_IP: db
      DB_USER: user
      DB_PASSWORD: password
      DB_DB: prod
      RANDOM_SECRET: "AJd27GqoS#gvxp@V"
      ML_SERVICE_URL: "http://ml-proxy:8008"
    depends_on:
      - db
      - ml-proxy
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tests:
    build: .
    profiles:
      - tests
    environment:
      DB_IP: db
      DB_USER: user
      DB_PASSWORD: password
      DB_DB: prod
      RANDOM_SECRET: "AJd27GqoS#gvxp@V"
    depends_on:
      - db
    command: ["pytest", "--cov=.", "--cov-report=term-missing", "-q", "--override-ini=asyncio_default_fixture_loop_scope=function", "-W", "ignore::DeprecationWarning"]

volumes:
  db-data:

