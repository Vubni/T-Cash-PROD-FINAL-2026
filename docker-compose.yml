services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: prod
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build: .
    restart: always
    environment:
      DB_IP: db
      DB_USER: user
      DB_PASSWORD: password
      DB_DB: prod
      RANDOM_SECRET: "AJd27GqoS#gvxp@V"
    depends_on:
      - db
    ports:
      - "8080:8080"

  tests:
    build: .
    environment:
      DB_IP: db
      DB_USER: user
      DB_PASSWORD: password
      DB_DB: prod
      RANDOM_SECRET: "AJd27GqoS#gvxp@V"
    depends_on:
      - db
    command: ["pytest", "--cov=.", "--cov-report=term-missing", "-q", "--override-ini=asyncio_default_fixture_loop_scope=function", "-W", "ignore::DeprecationWarning"]

volumes:
  db-data:

